name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
    paths-ignore:
      - "**/*.md"
      - ".github/rulesets/**"
  # No paths-ignore here. main-protection.json requires five checks
  # (Secret Scan, Build & Test 1.22.x, Build & Test 1.23.x, Dependency Review,
  # CodeQL Analysis (go)) with strict_required_status_checks_policy. If a docs
  # only PR skips this workflow, none of those contexts is ever reported and
  # the PR stays "Expected - Waiting for status to be reported" forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Policy secret scanner (repo)
        run: |
          chmod +x scripts/secret_scan.sh
          scripts/secret_scan.sh --repo

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell lint
        run: |
          chmod +x scripts/shellcheck_all.sh
          scripts/shellcheck_all.sh

  build-test:
    name: Build & Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Explicit, never relying on the script default: an unset threshold in
      # CI must not silently disable the coverage gate. It MUST stay equal to
      # the default in scripts/ci_guard.sh — when the floor moves, both move in
      # the same commit. Raise it as tests land; it may never go down.
      NASBOT_MIN_COVERAGE: "36"
      # ci_guard.sh owns the coverage gate and deletes the profile on exit;
      # keep it so the step below can upload it as an artifact.
      NASBOT_KEEP_COVERAGE: "1"
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.23.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Quality gate
        run: |
          chmod +x scripts/ci_guard.sh scripts/secret_scan.sh
          scripts/ci_guard.sh

      - name: Release script smoke
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh

      # No second `go test` here on purpose: the Quality gate step above already
      # ran the suite once with -coverprofile and already failed the job if the
      # total is below NASBOT_MIN_COVERAGE. Re-running would execute the whole
      # suite twice and could enforce two different numbers.
      - name: Coverage report (primary toolchain)
        if: matrix.go-version == '1.22.x'
        run: |
          test -f coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        if: matrix.go-version == '1.22.x'
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

      - name: Upload build artifacts
        if: matrix.go-version == '1.22.x'
        uses: actions/upload-artifact@v4
        with:
          name: nasbot-binaries
          path: |
            nasbot
            nasbot-arm64
