name: Deadlock & Race Gate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deadlock-race-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deadlock-race:
    # A matrix, not a fixed version: the builder image moved to 1.27, so the race
    # gate has to exercise the toolchain that actually ships the container.
    # 1.23.x stays in the matrix because it is the check name the `main` ruleset
    # requires — a required check that stops reporting leaves every pull request
    # waiting forever, which is the trap this matrix avoids by keeping it.
    # fail-fast is off so one version failing does not hide the other's result.
    name: Deadlock & Race (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.23.x", "1.27.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Ensure config.json for tests
        run: |
          if [ ! -f config.json ]; then
            cp config.example.json config.json
          fi

      - name: Deadlock-targeted stress tests
        run: |
          go test -tags deadlock -timeout 45s -count=30 -run 'TestNoDeadlock_|TestProcessKernelLinesNoDeadlock|TestHandleOOMLoopTriggersRebootAtThreshold|TestPeriodicReportStopsOnCancelledContext|TestHandleCallback(Nil|NilMessage|Unauthorized)' ./...

      - name: Full race gate
        run: |
          go test -tags deadlock -timeout 45s -race -count=1 ./...
