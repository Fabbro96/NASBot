name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (vX.Y.Z). Leave empty to refuse."
        required: true
        type: string

# Least privilege. The default for every job is read-only, and each write
# permission is granted only to the job that needs it, because that is the
# granularity GitHub supports: `permissions` inside a step is not valid and makes
# the whole workflow file unusable — GitHub rejects the file, produces no job, and
# reports a failed run on every push to any branch. An earlier version of this
# file granted contents/id-token/packages/attestations at workflow level, so the
# jobs that run the whole test suite and compile untrusted dependencies could
# mint an OIDC token and publish packages. Splitting by job fixes both: the
# permissions are still minimal, and the file is valid.
#
# The pipeline is therefore four jobs instead of one, with the built binaries
# passed along as an artifact instead of shared through one workspace.
permissions:
  contents: read

# One group per release TAG, so a re-run of the same tag is serialised while two
# different tags can never collide. Using github.ref here would split a
# tag-triggered run and a dispatch run into two groups and let them race to
# publish the same tag.
concurrency:
  group: release-tag-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build the binaries once, gate them, and hand them to the publishing jobs.
  # Read-only: it compiles the code and runs the test suite, and must not be able
  # to publish anything.
  # ---------------------------------------------------------------------------
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      # Before the checkout, on purpose. This step needs no repository: it reads
      # the event's ref and the dispatch input. Running it first means an
      # invalid or nonexistent tag is refused with an explicit message, instead
      # of dying in actions/checkout with "could not resolve ref" — which is what
      # it did before, because checkout resolved github.event.inputs.tag first.
      - name: Determine Version
        id: get_version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::no tag supplied; dispatch with the tag input or push a v* tag"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z-]+)*$ ]]; then
            echo "::error::refusing to publish, not a semantic tag: $TAG"
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          # Build the tree that is actually being tagged. Without this,
          # workflow_dispatch checks out whatever ref was picked in the UI while
          # the release is published under the tag typed in the input, so the
          # artifact can be a build of something else entirely. On a tag push
          # github.event.inputs.tag is empty and github.ref is the tag itself.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Release guard
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          chmod +x scripts/ci_guard.sh scripts/secret_scan.sh
          scripts/ci_guard.sh release "$RELEASE_TAG"

      - name: Build release binaries
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh

      - name: Generate checksums
        run: sha256sum nasbot nasbot-arm64 > SHA256SUMS.txt

      # What the downstream jobs publish. Kept to exactly the three files a
      # consumer needs: the two binaries and the manifest that verifies them.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            nasbot
            nasbot-arm64
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Attest provenance. Needs id-token for OIDC and attestations to write, and
  # nothing else — it does not run any of the repository's code.
  # ---------------------------------------------------------------------------
  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            nasbot
            nasbot-arm64
            SHA256SUMS.txt

  # ---------------------------------------------------------------------------
  # Publish the GitHub release. Only contents:write, and it consumes the artifact
  # rather than building anything.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: |
            nasbot
            nasbot-arm64
            SHA256SUMS.txt

  # ---------------------------------------------------------------------------
  # Push the container image. Rebuilds from the tagged source rather than reusing
  # the artifact, because the image is built for two platforms at once and needs
  # the whole build context.
  # ---------------------------------------------------------------------------
  docker:
    name: Publish container image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.build.outputs.tag }}