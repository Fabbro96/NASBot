name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild (vX.Y.Z). Leave empty to refuse."
        required: true
        type: string

# Least privilege: il default del workflow è SOLO in lettura. Ogni permesso in
# scrittura è dichiarato solo sul singolo step che ne ha bisogno, mai a livello
# di workflow. Prima era `contents/id-token/packages/attestations: write` per
# TUTTI gli step, quindi anche "Release guard" (che esegue l'intera suite di
# test, go vet e go build sul codice e sulle dipendenze) e "Build release
# binaries" potevano ottenere un token OIDC e pubblicare pacchetti. Se la supply
# chain di test o di build fosse compromessa, l'impatto era il pieno accesso
# invece di un checkout in sola lettura.
permissions:
  contents: read

# One group per release TAG, so a re-run of the same tag is serialised while
# two different tags can never collide. Using github.ref here would split a
# tag-triggered run and a dispatch run into two groups and let them race to
# publish the same tag.
concurrency:
  group: release-tag-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          # Build the tree that is actually being tagged. Without this,
          # workflow_dispatch checks out whatever ref was picked in the UI while
          # the release is published under the tag typed in the input, so the
          # artifact can be a build of something else entirely. On a tag push
          # github.event.inputs.tag is empty and github.ref is the tag itself.
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Every value below comes from the environment, never interpolated into
      # the script body. A ref name may legally contain quotes, $, ;, |, &,
      # so "${{ github.ref_name }}" inside a run block is remote code
      # execution on a runner holding contents/packages/id-token write.
      - name: Determine Version
        id: get_version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::no tag supplied; dispatch with the tag input or push a v* tag"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z-]+)*$ ]]; then
            echo "::error::refusing to publish, not a semantic tag: $TAG"
            exit 1
          fi
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf 'VERSION=%s\n' "$TAG" >> "$GITHUB_ENV"
          echo "Releasing $TAG"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Release guard
        if: steps.get_version.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          chmod +x scripts/ci_guard.sh scripts/secret_scan.sh
          scripts/ci_guard.sh release "$RELEASE_TAG"

      - name: Build release binaries
        if: steps.get_version.outputs.tag != ''
        run: |
          chmod +x scripts/build_release.sh
          ./scripts/build_release.sh

      - name: Generate checksums
        if: steps.get_version.outputs.tag != ''
        run: sha256sum nasbot nasbot-arm64 > SHA256SUMS.txt

      - name: Attest build provenance
        if: steps.get_version.outputs.tag != ''
        permissions:
          # id-token per l'OIDC, attestations per scrivere l'attestazione. Solo
          # qui: nessun altro step di questo workflow riceve questi permessi.
          contents: read
          attestations: write
          id-token: write
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            nasbot
            nasbot-arm64
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.get_version.outputs.tag != ''
        permissions:
          contents: write
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
          files: |
            nasbot
            nasbot-arm64
            SHA256SUMS.txt

      - name: Log in to the Container registry
        if: steps.get_version.outputs.tag != ''
        permissions:
          contents: read
          packages: write
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.get_version.outputs.tag != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.get_version.outputs.tag != ''
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        if: steps.get_version.outputs.tag != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.get_version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.get_version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.get_version.outputs.tag != ''
        permissions:
          contents: read
          packages: write
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.get_version.outputs.tag }}